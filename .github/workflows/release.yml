name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-13, windows-2022]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest tests/ -q

      - name: Build binary
        run: python build.py

      - name: Package release archive
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $platformMap = @{
            "Linux" = "linux"
            "macOS" = "darwin"
            "Windows" = "windows"
          }
          $platform = $platformMap["${{ runner.os }}"]
          $arch = "amd64"
          $base = "outlook-cli-$version-$platform-$arch"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if ("${{ runner.os }}" -eq "Windows") {
            Copy-Item dist/outlook-cli.exe release/outlook-cli.exe
            Compress-Archive -Path release/outlook-cli.exe -DestinationPath "release/$base.zip" -Force
            $hash = (Get-FileHash "release/$base.zip" -Algorithm SHA256).Hash.ToLower()
            "$hash  $base.zip" | Out-File -Encoding utf8 "release/checksums-$platform-$arch.txt"
          } else {
            Copy-Item dist/outlook-cli release/outlook-cli
            tar -C release -czf "release/$base.tar.gz" outlook-cli
            $hash = (Get-FileHash "release/$base.tar.gz" -Algorithm SHA256).Hash.ToLower()
            "$hash  $base.tar.gz" | Out-File -Encoding utf8 "release/checksums-$platform-$arch.txt"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: outlook-cli-${{ runner.os }}
          path: release/*

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find release-dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          find release-dist -type f -name "checksums-*.txt" -exec cat {} \; > release/checksums.txt
          test -s release/checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums
        shell: bash
        run: cosign sign-blob --bundle release/checksums.txt.sigstore.json release/checksums.txt --yes

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
