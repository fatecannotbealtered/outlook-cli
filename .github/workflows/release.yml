name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # PyInstaller binaries are not cross-compiled: one runner per OS/arch.
        # macos-15-intel = darwin-amd64 (macos-13 retired 2025-12), macos-14 =
        # darwin-arm64 (Apple Silicon), ubuntu-24.04-arm = linux-arm64.
        # win32-arm64 reuses the amd64 binary via Windows x64 emulation
        # (see prepare-npm-platform-packages.js).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-2022]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest tests/ -q

      - name: Build binary
        run: python build.py

      - name: Package release archive
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $platformMap = @{
            "Linux" = "linux"
            "macOS" = "darwin"
            "Windows" = "windows"
          }
          $platform = $platformMap["${{ runner.os }}"]
          $arch = if ("${{ runner.arch }}" -eq "ARM64") { "arm64" } else { "amd64" }
          $base = "outlook-cli-$version-$platform-$arch"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if ("${{ runner.os }}" -eq "Windows") {
            Copy-Item dist/outlook-cli.exe release/outlook-cli.exe
            Compress-Archive -Path release/outlook-cli.exe -DestinationPath "release/$base.zip" -Force
            $hash = (Get-FileHash "release/$base.zip" -Algorithm SHA256).Hash.ToLower()
            "$hash  $base.zip" | Out-File -Encoding utf8 "release/checksums-$platform-$arch.txt"
          } else {
            Copy-Item dist/outlook-cli release/outlook-cli
            tar -C release -czf "release/$base.tar.gz" outlook-cli
            $hash = (Get-FileHash "release/$base.tar.gz" -Algorithm SHA256).Hash.ToLower()
            "$hash  $base.tar.gz" | Out-File -Encoding utf8 "release/checksums-$platform-$arch.txt"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: outlook-cli-${{ matrix.os }}
          path: release/*

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-dist

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find release-dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          find release-dist -type f -name "checksums-*.txt" -exec cat {} \; > release/checksums.txt
          test -s release/checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums
        shell: bash
        run: cosign sign-blob --new-bundle-format --bundle release/checksums.txt.sigstore.json release/checksums.txt --yes

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Slice the '## [VERSION]' section out of CHANGELOG.md for this tag (awk: portable).
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Defensive fallback: if the slice is empty, point at the changelog.
          if [ ! -s release-notes.md ]; then
            printf '## v%s\n\nSee [CHANGELOG.md](CHANGELOG.md) for details.\n' "$VERSION" > release-notes.md
          fi

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          always-auth: true

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --dir dist --pattern "*.tar.gz" --pattern "*.zip"
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print

      - name: Prepare npm platform packages
        run: node scripts/prepare-npm-platform-packages.js dist npm-platform

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ROOT_PKG=$(node -p "require('./package.json').name")

          for dir in npm-platform/*; do
            [ -d "$dir" ] || continue
            PKG=$(node -p "require('./${dir}/package.json').name")
            if npm view "${PKG}@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
              echo "npm package ${PKG}@${VERSION} already published; skipping"
              continue
            fi
            npm publish "./$dir" --access public --provenance
          done

          if npm view "${ROOT_PKG}@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
            echo "npm package ${ROOT_PKG}@${VERSION} already published; skipping"
            exit 0
          fi
          # Keep platform pins in lockstep with the package version (single
          # source of truth): rewrite optionalDependencies to the published
          # version so an npm install never resolves a stale platform binary.
          node -e "const fs=require('fs'),p=require('./package.json');for(const k in (p.optionalDependencies||{}))p.optionalDependencies[k]=p.version;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+String.fromCharCode(10))"
          npm publish --access public --provenance
