name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check outlook_cli/ tests/

      - name: Check formatting with ruff
        run: ruff format --check outlook_cli/ tests/

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Audit npm package
        run: npm audit --omit=dev

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test (--help)
        run: python -m outlook_cli.main --help

  version-check:
    name: Verify version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      # gen-contract.js pipes the generated Python through `ruff format`, and
      # falls back to unformatted output when ruff is missing. Without ruff on
      # PATH this job would regenerate a differently-formatted contract_gen.py
      # and report drift against the correctly-formatted committed one. The
      # codegen verifier needs the same toolchain the codegen uses.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (required by the contract codegen)
        run: python -m pip install --upgrade pip && pip install ruff

      # Fail-closed: every derived version location must equal package.json.
      - name: Verify version sync
        run: node scripts/check-version.js

      - name: Verify spec/contract sync
        run: node scripts/check-spec.js --local-only
