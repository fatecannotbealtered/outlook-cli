# Committed ruff config for the Python flavour of outlook-cli.
#
# REPO-SPEC §6 requires the formatter config to live in the repo (not only in CI
# defaults) so local `ruff check` / `ruff format` match what CI enforces.
# ruff is used for both linting and formatting; no separate black/isort needed.

line-length = 100
target-version = "py310"

# outlook_cli/contract_gen.py is GENERATED from the fleet contract.json by
# scripts/gen-contract.js and is NOT excluded. It used to be: ruff format would
# rewrite it, and the rewrite then failed the codegen drift check. Since
# ai-native-cli-spec@v1.5.0 the generator pipes its output through `ruff format`
# itself, so the generated bytes already match what `ruff format --check`
# expects and the two no longer fight. Keep it in scope — an exclusion here
# would hide real findings in a file that ships.

[lint]
# E/F: pycodestyle + pyflakes (core correctness + style)
# I:   import sorting (isort)
# UP:  pyupgrade — keep syntax modern for the target version
# B:   flake8-bugbear — catch likely bugs and footguns
select = ["E", "F", "I", "UP", "B"]

[format]
# Defaults: double quotes, space indentation, auto line endings.
quote-style = "double"
indent-style = "space"
